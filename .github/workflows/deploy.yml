# Deploy the static MXGenius application shell to GitHub Pages.
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test application shell
        run: npm test

      # Pages serves the browser half of the thin iOS wrapper. Keep unrelated,
      # already-in-progress MCP formatting from blocking a static-only release,
      # while preserving the full Rust gate whenever that workspace changes.
      - name: Detect MCP workspace changes
        id: mcp_changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" != "push" || -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "${{ github.sha }}" -- services/mcp; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.mcp_changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Check Rust formatting
        if: steps.mcp_changes.outputs.changed == 'true'
        working-directory: services/mcp
        run: cargo fmt --all -- --check

      - name: Test MCP workspace
        if: steps.mcp_changes.outputs.changed == 'true'
        working-directory: services/mcp
        run: cargo test --workspace

      - name: Lint MCP workspace
        if: steps.mcp_changes.outputs.changed == 'true'
        working-directory: services/mcp
        run: cargo clippy --workspace --all-targets -- -D warnings

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble static release
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          cp -- *.html *.js *.css *.jpg *.png *.json *.md CNAME _site/ 2>/dev/null || true
          cp -R -- 3d-viewer assets icons media "Training Data" "Generated Reports" docs _site/ 2>/dev/null || true
          mkdir -p _site/schemas
          cp -- services/xr-diagnostics-kiosk/contracts/diagnostics-state.schema.json _site/schemas/edge-diagnostics-1.0.0.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
