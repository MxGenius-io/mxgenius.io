<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parts disposition — local preview (not part of the app)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="app-styles.css?v=5">
<link rel="stylesheet" href="parts-workspace.css?v=4">
<style>
  .demo-banner {
    background: #7c2d12; color: #fff; text-align: center;
    padding: 8px 12px; font: 600 13px/1.4 sans-serif;
  }
  .harness-log {
    margin: 16px; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; font: 12px/1.5 ui-monospace, monospace;
    white-space: pre-wrap; color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="demo-banner">Local preview harness — stubbed client, no production calls. Not linked from the app.</div>
<div id="partsWorkspaceRoot"></div>
<div class="harness-log" id="harnessLog">calls will appear here</div>

<script>
  // Minimal stubs so the workspace can render without Entra or the API.
  const log = (line) => {
    const el = document.getElementById('harnessLog');
    el.textContent = `${el.textContent === 'calls will appear here' ? '' : el.textContent + '\n'}${line}`;
  };

  window.__ocrMode = 'confident';
  const orders = [];
  const legs = [];
  window.__actor = 'approver';
  const robs = [];
  const rotables = [
    { id:'rt-a', partNumber:'MXG-DEMO-32-1101', serialNumber:'SN-0117', nomenclature:'Main wheel half',
      currentStatus:'installed', currentAircraftId:'N441TT', timesRepaired:2, version:1, retiredAt:null },
    { id:'rt-b', partNumber:'MXG-DEMO-32-1201', serialNumber:'SN-0231', nomenclature:'Main brake assembly',
      currentStatus:'in_stock', currentAircraftId:null, timesRepaired:1, version:1, retiredAt:null, hasOpenCore:true }
  ];
  let unit = {
    id: '11111111-1111-4111-8111-111111111111',
    partId: '22222222-2222-4222-8222-222222222222',
    partNumber: 'MS21042L3',
    description: 'NUT, SELF-LOCKING, REDUCED HEX',
    manufacturer: 'Monogram Aerospace',
    serialNumber: null,
    lotNumber: 'LOT-7781',
    quantity: 24,
    conditionCode: 'SV',
    status: 'quarantine',
    traceType: 'form_8130',
    certificateNumber: '8130-77421',
    locationId: '33333333-3333-4333-8333-333333333333',
    location: 'RECEIVING',
    ownerType: 'owned',
    metadata: {},
    version: 1,
    receivedAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  globalThis.MXGENIUS_CONFIG = { ready: Promise.resolve(), getSession: () => ({ organizationId: 'demo' }) };
  globalThis.MXGENIUS_AUTH = { getToken: async () => 'harness-token' };

  globalThis.MXApplicationClient = {
    parts: {
      search: async () => [unit],
      getUnit: async () => ({ unit, assets: [], events: [] }),
      createReceivingDraft: async () => {
        log('createReceivingDraft called');
        return { id: 'draft-1', partId: null, status: 'draft', proposedFields: {}, version: 1 };
      },
      confirmReceiving: async ({ draftId, version, values }) => {
        log(`confirmReceiving draft=${draftId} version=${version} part=${values.partNumber} qty=${values.quantity} loc=${values.locationCode}`);
        return { ...unit, id: 'new-unit', partNumber: values.partNumber, quantity: values.quantity };
      },
      registerAssetUpload: async () => { log('registerAssetUpload'); return { asset: { id:'a1' } }; },
      uploadAsset: async () => { log('uploadAsset'); return {}; },
      requestExtraction: async () => {
        log(`requestExtraction mode=${window.__ocrMode}`);
        // Mirrors the server stamp: requiresReview is the server's decision.
        const confident = [
          { id:'c1', fieldName:'partNumber', proposedValue:'MXG-DEMO-32-1301', confidence:0.97, requiresReview:false },
          { id:'c2', fieldName:'description', proposedValue:'Main tire, radial', confidence:0.94, requiresReview:false },
          { id:'c3', fieldName:'manufacturer', proposedValue:'MXG Demo Standard Parts', confidence:0.92, requiresReview:false }
        ];
        const mixed = confident.concat([
          { id:'c4', fieldName:'serialNumber', proposedValue:'DEMO-TIRE-88', confidence:0.99, requiresReview:true },
          { id:'c5', fieldName:'certificateNumber', proposedValue:'DEMO-8130-?', confidence:0.42, requiresReview:true }
        ]);
        return { run: { id:'run1' }, candidates: window.__ocrMode === 'mixed' ? mixed : confident };
      },
      reviewExtraction: async ({ decisions }) => {
        log(`reviewExtraction decisions=${decisions.length} accepted=${decisions.filter(d=>d.reviewState==='accepted').length}`);
        return { candidates: decisions.map(d => ({
          fieldName: ({c1:'partNumber',c2:'description',c3:'manufacturer',c4:'serialNumber',c5:'certificateNumber'})[d.candidateId],
          reviewState: d.reviewState,
          proposedValue: ({c1:'MXG-DEMO-32-1301',c2:'Main tire, radial',c3:'MXG Demo Standard Parts',c4:'DEMO-TIRE-88',c5:'DEMO-8130-?'})[d.candidateId],
          finalValue: d.finalValue
        })) };
      },
      listRequests: async ({ status, priority, overdueOnly, missingNeedByOnly }) => {
        const all = [
          { id:'r1', caseId:'c1', aircraftId:'N441TT', partId:'p1', partNumber:'MS21042L3',
            description:'NUT, SELF-LOCKING', quantity:12, quantityFulfilled:0, status:'requested',
            priority:'aog', requiredBy:'2026-08-18T00:00:00Z', openOrderCount:0,
            version:1, isOverdue:true, daysOverdue:3, missingNeedBy:false },
          { id:'r2', caseId:'c2', aircraftId:'N908BX', partId:'p2', partNumber:'AN960-10',
            description:'WASHER, FLAT', quantity:20, quantityFulfilled:20, status:'installed',
            priority:'stock', requiredBy:null, openOrderCount:1,
            version:3, isOverdue:false, daysOverdue:null, missingNeedBy:false },
          { id:'r3', caseId:'c3', aircraftId:'N77XY', partId:'p3', partNumber:'HYD-PUMP-9',
            description:'PUMP, HYDRAULIC', quantity:1, quantityFulfilled:0, status:'sourced',
            priority:'scheduled_mx', requiredBy:null, openOrderCount:0,
            version:1, isOverdue:false, daysOverdue:null, missingNeedBy:true }
        ];
        let rows = all;
        if (status) rows = rows.filter(r => r.status === status);
        if (priority) rows = rows.filter(r => r.priority === priority);
        if (overdueOnly) rows = rows.filter(r => r.isOverdue);
        if (missingNeedByOnly) rows = rows.filter(r => r.missingNeedBy);
        log(`listRequests status=${status||'*'} overdueOnly=${!!overdueOnly} rows=${rows.length}`);
        return { requests: rows, overdue: all.filter(r=>r.isOverdue).length,
                 missingNeedBy: all.filter(r=>r.missingNeedBy).length };
      },
      listOrders: async ({ requirementId }) => {
        log(`listOrders ${requirementId}`);
        return orders.filter(o => o.req === requirementId);
      },
      createOrder: async ({ requirementId, values }) => {
        log(`createOrder ${requirementId} kind=${values.orderKind} buy=${values.typeOfBuy} num=${values.orderNumber}`);
        const o = { id:'o'+(orders.length+1), req:requirementId, orderKind:values.orderKind,
                    typeOfBuy:values.typeOfBuy, orderNumber:values.orderNumber,
                    supplierName:values.supplierName, status:'draft', version:1, purchaseCostUsd:null };
        orders.push(o); return o;
      },
      setOrderStatus: async ({ orderId, version, status }) => {
        log(`setOrderStatus ${orderId} v${version} -> ${status}`);
        const o = orders.find(x => x.id === orderId);
        o.status = status; o.version += 1; return o;
      },
      listRequestHistory: async ({ requirementId }) => {
        log(`listRequestHistory ${requirementId}`);
        return [{ id:'h1', fieldName:'status', oldValue:'requested', newValue:'ordered',
                  actorUserId:'u1', createdAt:new Date().toISOString() }];
      },
      listShipments: async ({ requirementId }) => {
        log(`listShipments ${requirementId}`);
        return legs.filter(l => l.req === requirementId);
      },
      createShipment: async ({ requirementId, values }) => {
        log(`createShipment ${requirementId} purpose=${values.purpose} cert=${values.certificateType}`);
        const l = { id:'l'+(legs.length+1), req:requirementId, legSequence:legs.length+1,
                    purpose:values.purpose, carrier:values.carrier, origin:values.origin,
                    destination:values.destination, certificateType:values.certificateType,
                    certificateNumber:values.certificateNumber, status:'pending',
                    receivedAt:null, version:1 };
        legs.push(l); return l;
      },
      setShipmentStatus: async ({ shipmentId, version, status }) => {
        log(`setShipmentStatus ${shipmentId} v${version} -> ${status}`);
        const l = legs.find(x => x.id === shipmentId);
        l.status = status; l.version += 1;
        if (status === 'delivered') l.receivedAt = new Date().toISOString();
        return l;
      },
      listPartEvents: async () => {
        log('listPartEvents');
        return [
          { id:'e1', eventKind:'removal', partNumber:'MS21042L3', partSerial:'SN-9',
            aircraftId:'N441TT', removalReason:'cannibalized', eventAt:new Date().toISOString(),
            performedBy:'a.mechanic@x.io' },
          { id:'e2', eventKind:'install', partNumber:'MS21042L3', partSerial:'SN-9',
            aircraftId:'N908BX', removalReason:null, eventAt:new Date().toISOString(),
            performedBy:'a.mechanic@x.io' }
        ];
      },
      listRotables: async ({ status, includeRetired }) => {
        log(`listRotables status=${status||'*'} retired=${!!includeRetired}`);
        let rows = rotables.filter(r => includeRetired || !r.retiredAt);
        if (status) rows = rows.filter(r => r.currentStatus === status);
        return rows;
      },
      createRotable: async ({ values }) => {
        log(`createRotable ${values.partNumber}/${values.serialNumber} status=${values.currentStatus} ac=${values.currentAircraftId||'none'}`);
        // Mirror the server coherence rule so the harness exercises it.
        if (values.currentStatus === 'installed' && !values.currentAircraftId) {
          const e = new Error('an installed unit must record the aircraft it is installed on; set the aircraft, or change the status');
          e.status = 400; throw e;
        }
        if (values.currentStatus === 'in_stock' && values.currentAircraftId) {
          const e = new Error('a unit installed on an aircraft is not in stock; set the status to installed, or clear the aircraft');
          e.status = 400; throw e;
        }
        const r = { id:'rt'+(rotables.length+1), ...values, timesRepaired:0, version:1, retiredAt:null };
        rotables.push(r); return r;
      },
      updateRotable: async ({ rotableId, values }) => {
        log(`updateRotable ${rotableId} status=${values.currentStatus} ac=${values.currentAircraftId||'none'}`);
        if (values.currentStatus === 'installed' && !values.currentAircraftId) {
          const e = new Error('an installed unit must record the aircraft it is installed on; set the aircraft, or change the status');
          e.status = 400; throw e;
        }
        const r = rotables.find(x => x.id === rotableId);
        Object.assign(r, values); r.version += 1; return r;
      },
      retireRotable: async ({ rotableId, reason }) => {
        log(`retireRotable ${rotableId} reason="${reason}"`);
        const r = rotables.find(x => x.id === rotableId);
        if (r.hasOpenCore) { const e = new Error('this unit cannot be retired: a core exchange on this unit is still due'); e.status = 409; throw e; }
        r.retiredAt = new Date().toISOString(); r.version += 1; return r;
      },
      listCannibalizations: async () => { log('listCannibalizations'); return robs; },
      proposeCannibalization: async ({ values }) => {
        log(`proposeCannibalization ${values.serialNumber} ${values.donorAircraftId}->${values.receiverAircraftId} llp=${values.isLifeLimited}`);
        if (!values.serialNumber) { const e = new Error('a rob must identify the part being taken: give a rotable unit or a serial number'); e.status=400; throw e; }
        if (values.donorAircraftId && values.receiverAircraftId &&
            values.donorAircraftId.toLowerCase() === values.receiverAircraftId.toLowerCase()) {
          const e = new Error('an aircraft cannot rob itself'); e.status=400; throw e;
        }
        const r = { id:'rob'+(robs.length+1), ...values, status:'proposed', version:1,
                    transferredHours:null, transferredCycles:null,
                    donorRemovalEventId:null, receiverInstallEventId:null, proposedBy:'proposer' };
        robs.push(r); return r;
      },
      decideCannibalization: async ({ cannId, status, values }) => {
        log(`decideCannibalization ${cannId} -> ${status} hrs=${values.transferredHours ?? '-'}`);
        const r = robs.find(x => x.id === cannId);
        if ((status === 'approved' || status === 'rejected') && window.__actor === r.proposedBy) {
          const e = new Error('the person who proposed a cannibalization cannot decide it'); e.status=403; throw e;
        }
        if (status === 'approved' && r.isLifeLimited && values.transferredHours == null && values.transferredCycles == null) {
          const e = new Error('this is a life-limited part; record the hours or cycles crossing to the receiving aircraft before approving'); e.status=400; throw e;
        }
        if (status === 'completed' && !(r.donorRemovalEventId && r.receiverInstallEventId)) {
          const e = new Error("the donor removal must be recorded with the reason 'cannibalized', otherwise this is an ordinary removal and not a rob"); e.status=400; throw e;
        }
        r.status = status; r.version += 1;
        if (values.transferredHours != null) r.transferredHours = values.transferredHours;
        return r;
      },
      listShortages: async ({ includeCovered }) => {
        const rows = [
          { requirementId:'r1', caseId:'c1', caseStatus:'awaiting_parts', casePriority:'aog',
            aircraftId:'N441TT', partId:'p1', partNumber:'MS21042L3', description:'NUT, SELF-LOCKING',
            requiredQuantity:12, requiredBy:'2026-08-22T00:00:00Z', acceptableConditions:['NE','SV'],
            availableQuantity:4, shortfall:8 },
          { requirementId:'r2', caseId:'c2', caseStatus:'planning', casePriority:'routine',
            aircraftId:'N908BX', partId:'p2', partNumber:'AN960-10', description:'WASHER, FLAT',
            requiredQuantity:20, requiredBy:null, acceptableConditions:[],
            availableQuantity:60, shortfall:0 }
        ];
        const visible = includeCovered ? rows : rows.filter(r => r.shortfall > 0);
        log(`listShortages includeCovered=${!!includeCovered} rows=${visible.length}`);
        return { shortages: visible, outstanding: rows.filter(r => r.shortfall > 0).length };
      },
      listLocations: async ({ includeInactive } = {}) => {
        const all = [
          { id: 'l1', code: 'RECEIVING', name: 'Receiving dock', locationType: 'receiving', active: true },
          { id: 'l2', code: 'STOCK-A12', name: 'Bonded shelf A12', locationType: 'stock', active: true },
          { id: 'l3', code: 'SCRAP', name: 'Scrap bin', locationType: 'scrap', active: false }
        ];
        return includeInactive ? all : all.filter(l => l.active);
      },
      createLocation: async ({ code, locationType }) => {
        log(`createLocation code=${code} type=${locationType}`);
        return { id: 'new', code, locationType, active: true };
      },
      updateLocation: async ({ locationId, active }) => {
        log(`updateLocation id=${locationId} active=${active}`);
        return { id: locationId, active };
      },
      dispositionUnit: async ({ action, locationCode, referenceId, notes, version }) => {
        log(`dispositionUnit action=${action} version=${version} location=${locationCode || '(unchanged)'} ref=${referenceId || '(none)'} notes=${notes || '(none)'}`);
        const NEXT = {
          inspect_pass: 'available', inspect_reject: 'rejected',
          reserve: 'reserved', unreserve: 'available', issue: 'issued',
          return: 'available', scrap: 'scrapped', ship: 'shipped',
          transfer: unit.status
        };
        unit = {
          ...unit,
          status: NEXT[action],
          location: locationCode || unit.location,
          version: unit.version + 1
        };
        return unit;
      },
      adjustQuantity: async ({ countedQuantity, reason, notes, version }) => {
        log(`adjustQuantity version=${version} counted=${countedQuantity} reason=${reason} notes=${notes || '(none)'}`);
        unit = { ...unit, quantity: countedQuantity, version: unit.version + 1 };
        return unit;
      },
      splitUnit: async ({ quantity, locationCode, version }) => {
        log(`splitUnit version=${version} qty=${quantity} to=${locationCode || '(same)'}`);
        const remainder = unit.quantity - quantity;
        unit = { ...unit, quantity: remainder, version: unit.version + 1 };
        return { ...unit, id: 'split-child', quantity, location: locationCode || unit.location, version: 1 };
      },
      correctUnit: async ({ values, version }) => {
        log(`correctUnit version=${version} ${JSON.stringify(values)}`);
        unit = { ...unit, ...values, version: unit.version + 1 };
        return unit;
      },
      listDocuments: async () => [],
      listTransactions: async () => [],
      getFaaCandidates: async () => ({ state: 'no_candidates', candidates: [] }),
      getLabel: async () => ({ qrDataUrl: '', partNumber: unit.partNumber, humanReadableId: 'FB-1' })
    }
  };
</script>
<script src="parts-workspace.js?v=5"></script>
</body>
</html>
