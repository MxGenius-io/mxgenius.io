<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parts disposition — local preview (not part of the app)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="app-styles.css?v=5">
<link rel="stylesheet" href="parts-workspace.css?v=4">
<style>
  .demo-banner {
    background: #7c2d12; color: #fff; text-align: center;
    padding: 8px 12px; font: 600 13px/1.4 sans-serif;
  }
  .harness-log {
    margin: 16px; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; font: 12px/1.5 ui-monospace, monospace;
    white-space: pre-wrap; color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="demo-banner">Local preview harness — stubbed client, no production calls. Not linked from the app.</div>
<div id="partsWorkspaceRoot"></div>
<div class="harness-log" id="harnessLog">calls will appear here</div>

<script>
  // Minimal stubs so the workspace can render without Entra or the API.
  const log = (line) => {
    const el = document.getElementById('harnessLog');
    el.textContent = `${el.textContent === 'calls will appear here' ? '' : el.textContent + '\n'}${line}`;
  };

  let unit = {
    id: '11111111-1111-4111-8111-111111111111',
    partId: '22222222-2222-4222-8222-222222222222',
    partNumber: 'MS21042L3',
    description: 'NUT, SELF-LOCKING, REDUCED HEX',
    manufacturer: 'Monogram Aerospace',
    serialNumber: 'SN-40199',
    lotNumber: null,
    quantity: 1,
    conditionCode: 'SV',
    status: 'quarantine',
    traceType: 'form_8130',
    certificateNumber: '8130-77421',
    locationId: '33333333-3333-4333-8333-333333333333',
    location: 'RECEIVING',
    ownerType: 'owned',
    metadata: {},
    version: 1,
    receivedAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  globalThis.MXGENIUS_CONFIG = { ready: Promise.resolve(), getSession: () => ({ organizationId: 'demo' }) };
  globalThis.MXGENIUS_AUTH = { getToken: async () => 'harness-token' };

  globalThis.MXApplicationClient = {
    parts: {
      search: async () => [unit],
      getUnit: async () => ({ unit, assets: [], events: [] }),
      listLocations: async () => ([
        { id: 'l1', code: 'RECEIVING', name: 'Receiving dock' },
        { id: 'l2', code: 'STOCK-A12', name: 'Bonded shelf A12' },
        { id: 'l3', code: 'SCRAP', name: 'Scrap bin' }
      ]),
      dispositionUnit: async ({ action, locationCode, referenceId, notes, version }) => {
        log(`dispositionUnit action=${action} version=${version} location=${locationCode || '(unchanged)'} ref=${referenceId || '(none)'} notes=${notes || '(none)'}`);
        const NEXT = {
          inspect_pass: 'available', inspect_reject: 'rejected',
          reserve: 'reserved', unreserve: 'available', issue: 'issued',
          return: 'available', scrap: 'scrapped', ship: 'shipped',
          transfer: unit.status
        };
        unit = {
          ...unit,
          status: NEXT[action],
          location: locationCode || unit.location,
          version: unit.version + 1
        };
        return unit;
      },
      correctUnit: async ({ values, version }) => {
        log(`correctUnit version=${version} ${JSON.stringify(values)}`);
        unit = { ...unit, ...values, version: unit.version + 1 };
        return unit;
      },
      listDocuments: async () => [],
      listTransactions: async () => [],
      getFaaCandidates: async () => ({ state: 'no_candidates', candidates: [] }),
      getLabel: async () => ({ qrDataUrl: '', partNumber: unit.partNumber, humanReadableId: 'FB-1' })
    }
  };
</script>
<script src="parts-workspace.js?v=5"></script>
</body>
</html>
