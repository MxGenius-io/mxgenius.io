<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MXGenius</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        
        .login-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            margin-bottom: 4px;
        }

        .logo svg {
            width: 80px;
            height: 40px;
        }
        
        .logo-sub {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            margin-bottom: 32px;
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-icon svg {
            width: 32px;
            height: 32px;
        }
        
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .message {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }

        .contact-link {
            display: block;
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .contact-link:hover {
            color: #93c5fd;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
        }
        
        .footer a {
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 128 64" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <g id="airplane">
                        <path d="M 25 32 L 60 28 L 75 32 L 60 36 Z" fill="url(#blueGradient)" stroke="#1e40af" stroke-width="0.5" stroke-linejoin="round"/>
                        <circle cx="27" cy="32" r="3.5" fill="#93c5fd" stroke="#1e40af" stroke-width="0.5"/>
                        <path d="M 50 32 L 38 26 L 38 38 Z" fill="url(#accentGradient)" stroke="#1e40af" stroke-width="0.5" stroke-linejoin="round"/>
                        <path d="M 50 32 L 62 26 L 62 38 Z" fill="url(#accentGradient)" stroke="#1e40af" stroke-width="0.5" stroke-linejoin="round"/>
                        <path d="M 72 32 L 68 29 L 68 35 Z" fill="url(#blueGradient)" stroke="#1e40af" stroke-width="0.5" stroke-linejoin="round"/>
                    </g>
                    <g id="wrench" transform="translate(75, 32)">
                        <line x1="0" y1="0" x2="22" y2="-15" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="22" cy="-15" r="4.5" fill="none" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 18 -13 L 26 -17" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="0" cy="0" r="2.5" fill="url(#blueGradient)"/>
                    </g>
                    <g id="sparks" opacity="0.8">
                        <line x1="102" y1="18" x2="105" y2="15" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="104" y1="16" x2="107" y2="13" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="110" y1="25" x2="113" y2="22" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
                        <line x1="112" y1="23" x2="115" y2="20" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round"/>
                    </g>
                </svg>
                <span>MXGenius</span>
            </a>
            <div class="logo-sub">Aviation Maintenance Platform</div>

            <div class="lock-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h1>Platform Access</h1>
            <p class="message">
                Sign in with your organization’s Microsoft account to open the operations dashboard.
            </p>
            
            <button type="button" class="cta-button" data-entra-signin disabled>Sign in with Microsoft</button>
            <a href="waitlist.html" class="contact-link">Request early access →</a>
            
            <div class="footer" style="margin-top: 32px;">
                Powered by <a href="index.html">MXgenius</a> | <a href="trust-center.html">Trust Center</a>
            </div>
        </div>
    </div>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js" crossorigin="anonymous"></script>
    <script src="runtime-config.js?v=5"></script>
    <script src="auth.js?v=3"></script>
</body>
</html>
