<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">XDrive Raspberry Pi 5 voice breadboard schematic</title>
  <desc id="desc">Electret microphone through a preamp and USB audio adapter, speaker through an amplifier, push-to-talk on GPIO17 to ground, and power button across the Pi 5 J2 header.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#41d7e7"/></marker>
    <style>
      .bg{fill:#07101d}.box{fill:#0d1f32;stroke:#41d7e7;stroke-width:2}.pi{fill:#102a24;stroke:#4ade80;stroke-width:3}.wire{fill:none;stroke:#41d7e7;stroke-width:4;marker-end:url(#arrow)}.contact{fill:none;stroke:#fbbf24;stroke-width:4}.ground{stroke:#e5edf3;stroke-width:3}.title{fill:#edfaff;font:700 30px system-ui,sans-serif}.label{fill:#edfaff;font:700 20px system-ui,sans-serif}.small{fill:#9bb8c8;font:16px system-ui,sans-serif}.pin{fill:#fbbf24;font:700 17px ui-monospace,monospace}.warn{fill:#fb7185;font:700 16px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1400" height="820" rx="24"/>
  <text class="title" x="50" y="58">XDrive voice breadboard · Raspberry Pi 5</text>
  <text class="small" x="50" y="88">Minimum POC: USB audio, one GPIO trigger, and the dedicated J2 power-button input</text>

  <rect class="pi" x="540" y="225" width="320" height="280" rx="28"/>
  <text class="label" x="700" y="280" text-anchor="middle">Raspberry Pi 5</text>
  <text class="small" x="700" y="316" text-anchor="middle">Chromium kiosk + WebRTC</text>
  <text class="small" x="700" y="345" text-anchor="middle">enrolled device identity</text>
  <rect class="box" x="585" y="380" width="230" height="80" rx="14"/>
  <text class="label" x="700" y="414" text-anchor="middle">USB audio adapter</text>
  <text class="small" x="700" y="442" text-anchor="middle">mic in + line/headphone out</text>

  <circle class="box" cx="105" cy="330" r="55"/>
  <text class="label" x="105" y="322" text-anchor="middle">MIC</text>
  <text class="small" x="105" y="349" text-anchor="middle">electret</text>
  <rect class="box" x="220" y="280" width="210" height="100" rx="16"/>
  <text class="label" x="325" y="322" text-anchor="middle">Bias + preamp</text>
  <text class="small" x="325" y="351" text-anchor="middle">or biased mic input</text>
  <path class="wire" d="M160 330 H215"/>
  <path class="wire" d="M430 330 H520 Q540 330 560 380"/>

  <rect class="box" x="970" y="280" width="190" height="100" rx="16"/>
  <text class="label" x="1065" y="322" text-anchor="middle">5 V amplifier</text>
  <text class="small" x="1065" y="351" text-anchor="middle">match speaker Ω</text>
  <rect class="box" x="1240" y="275" width="110" height="110" rx="16"/>
  <path d="M1272 309 H1300 L1325 287 V373 L1300 351 H1272 Z" fill="none" stroke="#edfaff" stroke-width="4"/>
  <path class="wire" d="M815 420 H915 Q940 420 965 355"/>
  <path class="wire" d="M1160 330 H1230"/>
  <text class="warn" x="1065" y="407" text-anchor="middle">Never drive raw speaker from GPIO</text>

  <rect class="box" x="80" y="570" width="420" height="170" rx="18"/>
  <text class="label" x="105" y="610">TALK · normally-open momentary</text>
  <text class="pin" x="105" y="653">GPIO17 · physical pin 11</text>
  <line class="contact" x1="360" y1="648" x2="420" y2="615"/>
  <circle cx="350" cy="650" r="7" fill="#fbbf24"/><circle cx="430" cy="650" r="7" fill="#fbbf24"/>
  <line class="contact" x1="430" y1="650" x2="430" y2="682"/>
  <line class="ground" x1="404" y1="682" x2="456" y2="682"/><line class="ground" x1="412" y1="692" x2="448" y2="692"/><line class="ground" x1="420" y1="702" x2="440" y2="702"/>
  <text class="small" x="105" y="710">Internal pull-up · press pulls low · 30 ms debounce</text>
  <path class="wire" d="M500 625 H580 V505"/>

  <rect class="box" x="900" y="570" width="420" height="170" rx="18"/>
  <text class="label" x="925" y="610">POWER · normally-open momentary</text>
  <text class="pin" x="925" y="653">Pi 5 J2 pad</text>
  <line class="contact" x1="1120" y1="648" x2="1180" y2="615"/>
  <circle cx="1110" cy="650" r="7" fill="#fbbf24"/><circle cx="1190" cy="650" r="7" fill="#fbbf24"/>
  <text class="pin" x="1210" y="653">J2 pad</text>
  <text class="small" x="925" y="710">Brief press = normal Pi power action · long hold = forced shutdown</text>
  <path class="wire" d="M900 625 H820 V505"/>

  <text class="small" x="700" y="785" text-anchor="middle">All audio stays on USB. GPIO17 is contact sensing only. J2 is the Pi 5 power-button header—not a supply input.</text>
</svg>
