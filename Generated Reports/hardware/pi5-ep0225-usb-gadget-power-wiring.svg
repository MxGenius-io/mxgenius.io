<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi 5 and 52Pi EP-0225 USB gadget power wiring</title>
  <desc id="desc">A safety-focused component-side wiring diagram showing the two V output pads on a 52Pi EP-0225 connected to Raspberry Pi physical pins 2 and 4, and the two G output pads connected to physical pins 6 and 9, leaving the Pi USB-C port free for USB gadget data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d2030"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16d4ff"/>
      <stop offset="1" stop-color="#46f0c0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#28dddc"/>
    </marker>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f5f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Pi 5 USB Gadget — Independent Power Harness</text>
  <text x="70" y="110" fill="#9fb1c8" font-family="Segoe UI, Arial, sans-serif" font-size="21">52Pi EP-0225 / P01 · component side shown · physical Pi header pin numbers</text>

  <rect x="70" y="140" width="1460" height="86" rx="18" fill="#361517" stroke="#ff6b70" stroke-width="2"/>
  <text x="100" y="176" fill="#ff9ba0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">STOP — POWER OFF BEFORE WIRING</text>
  <text x="100" y="207" fill="#ffd6d8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Confirm the board silk says “RPI5 PD POWER” and “P01”. Never energize USB-PD INPUT and 9–24V DC INPUT at the same time.</text>

  <!-- 52Pi board -->
  <g filter="url(#shadow)">
    <rect x="70" y="270" width="560" height="470" rx="30" fill="#111722" stroke="#6f8198" stroke-width="3"/>
    <text x="105" y="320" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">52Pi EP-0225 / P01</text>
    <text x="105" y="350" fill="#8fa0b7" font-family="Segoe UI, Arial, sans-serif" font-size="18">COMPONENT SIDE · auxiliary +5V output</text>

    <rect x="145" y="400" width="250" height="160" rx="20" fill="#202a37" stroke="#93a6bc" stroke-width="2"/>
    <text x="170" y="435" fill="#dfe8f5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">OUTPUT PADS</text>
    <text x="170" y="462" fill="#9fb1c8" font-family="Consolas, monospace" font-size="15">silk: V V / G G / +5V</text>

    <circle cx="220" cy="505" r="24" fill="#a31e2b" stroke="#ff6b70" stroke-width="4"/>
    <circle cx="320" cy="505" r="24" fill="#a31e2b" stroke="#ff6b70" stroke-width="4"/>
    <circle cx="220" cy="550" r="24" fill="#14181e" stroke="#cbd5e2" stroke-width="4"/>
    <circle cx="320" cy="550" r="24" fill="#14181e" stroke="#cbd5e2" stroke-width="4"/>
    <text x="212" y="513" fill="#fff" font-family="Consolas, monospace" font-size="22" font-weight="700">V</text>
    <text x="312" y="513" fill="#fff" font-family="Consolas, monospace" font-size="22" font-weight="700">V</text>
    <text x="212" y="558" fill="#fff" font-family="Consolas, monospace" font-size="22" font-weight="700">G</text>
    <text x="312" y="558" fill="#fff" font-family="Consolas, monospace" font-size="22" font-weight="700">G</text>

    <rect x="105" y="625" width="205" height="70" rx="14" fill="#1b2430" stroke="#7589a2"/>
    <text x="126" y="654" fill="#dce6f3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">POWER INPUT</text>
    <text x="126" y="680" fill="#ffcf66" font-family="Segoe UI, Arial, sans-serif" font-size="15">Choose exactly ONE input</text>
    <rect x="335" y="625" width="250" height="70" rx="14" fill="#251a1b" stroke="#ff6b70"/>
    <text x="362" y="654" fill="#ff9ba0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">USB-C OUTPUT</text>
    <text x="362" y="680" fill="#ffd6d8" font-family="Segoe UI, Arial, sans-serif" font-size="15">LEAVE EMPTY</text>
  </g>

  <!-- Pi header -->
  <g filter="url(#shadow)">
    <rect x="970" y="270" width="560" height="470" rx="30" fill="#122c29" stroke="#4ccba5" stroke-width="3"/>
    <text x="1005" y="320" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Raspberry Pi 5</text>
    <text x="1005" y="350" fill="#9fc6be" font-family="Segoe UI, Arial, sans-serif" font-size="18">40-PIN HEADER · first five rows only</text>

    <circle cx="1025" cy="390" r="8" fill="#ffd15c"/>
    <text x="1043" y="397" fill="#ffdc7f" font-family="Segoe UI, Arial, sans-serif" font-size="15">Pin 1 marker — verify this corner before connecting</text>

    <!-- Header labels and pins -->
    <g font-family="Consolas, monospace" font-size="16">
      <text x="1065" y="445" text-anchor="end" fill="#ffae53">1 · 3V3</text>
      <circle cx="1090" cy="439" r="16" fill="#7b4c12" stroke="#ffae53" stroke-width="3"/>
      <circle cx="1210" cy="439" r="16" fill="#a31e2b" stroke="#ff6b70" stroke-width="3"/>
      <text x="1237" y="445" fill="#ff8f94" font-weight="700">2 · +5V</text>

      <text x="1065" y="500" text-anchor="end" fill="#8fa0b7">3 · GPIO2</text>
      <circle cx="1090" cy="494" r="16" fill="#2d3948" stroke="#6f8198" stroke-width="3"/>
      <circle cx="1210" cy="494" r="16" fill="#a31e2b" stroke="#ff6b70" stroke-width="3"/>
      <text x="1237" y="500" fill="#ff8f94" font-weight="700">4 · +5V</text>

      <text x="1065" y="555" text-anchor="end" fill="#8fa0b7">5 · GPIO3</text>
      <circle cx="1090" cy="549" r="16" fill="#2d3948" stroke="#6f8198" stroke-width="3"/>
      <circle cx="1210" cy="549" r="16" fill="#14181e" stroke="#dfe8f5" stroke-width="3"/>
      <text x="1237" y="555" fill="#dfe8f5" font-weight="700">6 · GND</text>

      <text x="1065" y="610" text-anchor="end" fill="#8fa0b7">7 · GPIO4</text>
      <circle cx="1090" cy="604" r="16" fill="#2d3948" stroke="#6f8198" stroke-width="3"/>
      <circle cx="1210" cy="604" r="16" fill="#2d3948" stroke="#6f8198" stroke-width="3"/>
      <text x="1237" y="610" fill="#8fa0b7">8 · GPIO14</text>

      <text x="1065" y="665" text-anchor="end" fill="#dfe8f5" font-weight="700">9 · GND</text>
      <circle cx="1090" cy="659" r="16" fill="#14181e" stroke="#dfe8f5" stroke-width="3"/>
      <circle cx="1210" cy="659" r="16" fill="#2d3948" stroke="#6f8198" stroke-width="3"/>
      <text x="1237" y="665" fill="#8fa0b7">10 · GPIO15</text>
    </g>

    <rect x="1010" y="690" width="475" height="28" rx="8" fill="#083c48" stroke="#1dd2f0"/>
    <text x="1248" y="710" text-anchor="middle" fill="#8eefff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Pi USB-C remains free for DATA / USB GADGET</text>
  </g>

  <!-- Wires -->
  <path d="M220 505 C600 505, 690 439, 1190 439" fill="none" stroke="#ff4f57" stroke-width="10" stroke-linecap="round"/>
  <path d="M320 505 C640 505, 735 494, 1190 494" fill="none" stroke="#ff4f57" stroke-width="10" stroke-linecap="round"/>
  <path d="M220 550 C600 550, 745 549, 1190 549" fill="none" stroke="#e8eef7" stroke-width="10" stroke-linecap="round"/>
  <path d="M320 550 C625 550, 720 659, 1070 659" fill="none" stroke="#e8eef7" stroke-width="10" stroke-linecap="round"/>

  <rect x="645" y="372" width="300" height="164" rx="18" fill="#111b27" stroke="#68809a" stroke-width="2"/>
  <text x="795" y="407" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">HARNESS</text>
  <text x="675" y="440" fill="#ff777d" font-family="Segoe UI, Arial, sans-serif" font-size="16">2 × red: V → pins 2 &amp; 4</text>
  <text x="675" y="470" fill="#e8eef7" font-family="Segoe UI, Arial, sans-serif" font-size="16">2 × black: G → pins 6 &amp; 9</text>
  <text x="675" y="501" fill="#9fb1c8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Short · equal length · ≥5 A total rating</text>

  <!-- Data path -->
  <path d="M1245 740 L1245 795 L1450 795" fill="none" stroke="url(#blue)" stroke-width="8" marker-end="url(#arrowBlue)"/>
  <text x="1000" y="790" fill="#7cf2e1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">USB-C data cable</text>
  <text x="1450" y="828" text-anchor="end" fill="#bceff0" font-family="Segoe UI, Arial, sans-serif" font-size="17">→ equipment / host sees “MXGenius Equipment Pack”</text>

  <!-- Checklist -->
  <rect x="70" y="810" width="1460" height="190" rx="24" fill="#0b1724" stroke="#35516b" stroke-width="2"/>
  <text x="100" y="852" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Before the Pi is connected</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <text x="105" y="890" fill="#d9e6f4"><tspan fill="#54e6bd" font-weight="700">1.</tspan> With everything unpowered, continuity-check each wire and confirm there is no +5V-to-GND short.</text>
    <text x="105" y="923" fill="#d9e6f4"><tspan fill="#54e6bd" font-weight="700">2.</tspan> Power the EP-0225 alone; meter V-to-G at the output pads. Vendor target is about +5.15V with correct polarity.</text>
    <text x="105" y="956" fill="#d9e6f4"><tspan fill="#54e6bd" font-weight="700">3.</tspan> Remove input power, attach the keyed Pi connector, then perform a current-limited first startup before adding USB-C data.</text>
    <text x="105" y="986" fill="#ffbd70"><tspan font-weight="700">Do not use loose Dupont jumpers at this current.</tspan> Add strain relief. Do not solder directly to the Pi when its header can accept a proper connector.</text>
  </g>

  <text x="70" y="1030" fill="#71869d" font-family="Segoe UI, Arial, sans-serif" font-size="13">References: 52Pi EP-0225 vendor documentation and Raspberry Pi RP-009276-WP OTG guide. Verify your physical board revision and silkscreen before assembly.</text>
</svg>
